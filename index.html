<script>
const DATA=JSON.parse(document.getElementById("beyblade-data").textContent);const MODE_LABELS={code:"\u4ee3\u865f",name:"\u540d\u7a31",ratchet:"\u56fa\u9396",bit:"\u8ef8\u5fc3"};const PLACEHOLDERS={code:"\u8f38\u5165 CX-18\u3001BX-50-01\u3001UX-21",name:"\u8f38\u5165 \u8155\u9f8d\u3001\u84bc\u9f8d\u3001\u9a0e\u58eb",ratchet:"\u8f38\u5165 5-70\u30013-60\u30011-80",bit:"\u8f38\u5165 NR\u3001T\u3001K\u3001LF"};const POPULAR={code:["CX-18","CX-17","BX-50","UX-21"],name:["\u8155\u9f8d","\u84bc\u9f8d","\u9a0e\u58eb","\u9cf3\u51f0"],ratchet:["3-60","5-70","4-60","1-80"],bit:["NR","T","K","LF"]};const state={mode:"code",query:""};const input=document.getElementById("searchInput"),clearButton=document.getElementById("clearButton"),results=document.getElementById("results"),statusText=document.getElementById("statusText"),quickFilters=document.getElementById("quickFilters"),totalCount=document.getElementById("totalCount");totalCount.textContent=DATA.length;function normalize(value){return String(value||"").trim().toLocaleUpperCase()}function matches(row,mode,query){if(!query)return true;const needle=normalize(query),value=normalize(row[mode]);if(mode==="ratchet"||mode==="bit")return value===needle||value.includes(needle);return value.includes(needle)}function escapeHtml(value){return String(value).replace(/[&<>"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]))}function highlight(value,query){const text=String(value||"");if(!query)return escapeHtml(text||"-");const index=normalize(text).indexOf(normalize(query));if(index<0)return escapeHtml(text||"-");const end=index+String(query).trim().length;return escapeHtml(text.slice(0,index))+"<mark>"+escapeHtml(text.slice(index,end))+"</mark>"+escapeHtml(text.slice(end))}function renderQuickFilters(){quickFilters.innerHTML=POPULAR[state.mode].map(item=>`<button class="chip" type="button" data-value="${escapeHtml(item)}">${escapeHtml(item)}</button>`).join("")}function render(){const filtered=DATA.filter(row=>matches(row,state.mode,state.query));const queryLabel=state.query?`\u300c${escapeHtml(state.query)}\u300d`:"\u5168\u90e8";statusText.innerHTML=state.query?`${MODE_LABELS[state.mode]}\u641c\u5c0b ${queryLabel}\uff1a${filtered.length} \u7b46`:`\u986f\u793a\u5168\u90e8\u8cc7\u6599\uff1a${filtered.length} \u7b46`;if(!filtered.length){results.classList.remove("compact");results.innerHTML=`<div class="empty-state">\u627e\u4e0d\u5230\u7b26\u5408 ${queryLabel} \u7684\u9640\u87ba\u8cc7\u6599</div>`;return}results.classList.toggle("compact",filtered.length>8);results.innerHTML=filtered.map(row=>`<article class="bey-card"><div class="card-head"><span class="code">${highlight(row.code,state.mode==="code"?state.query:"")}</span><h2 class="name">${highlight(row.name,state.mode==="name"?state.query:"")}</h2></div><div class="specs"><div class="spec"><span>\u56fa\u9396</span><strong>${highlight(row.ratchet,state.mode==="ratchet"?state.query:"")}</strong></div><div class="spec"><span>\u8ef8\u5fc3</span><strong>${highlight(row.bit,state.mode==="bit"?state.query:"")}</strong></div></div></article>`).join("")}function setMode(mode){state.mode=mode;input.placeholder=PLACEHOLDERS[mode];document.querySelectorAll(".mode-tab").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.mode===mode)));renderQuickFilters();render()}document.querySelectorAll(".mode-tab").forEach(button=>button.addEventListener("click",()=>setMode(button.dataset.mode)));input.addEventListener("input",()=>{state.query=input.value;render()});clearButton.addEventListener("click",()=>{input.value="";state.query="";input.focus();render()});quickFilters.addEventListener("click",event=>{const button=event.target.closest("button[data-value]");if(!button)return;input.value=button.dataset.value;state.query=button.dataset.value;input.focus();render()});renderQuickFilters();render();
</script>
</body>
</html>
